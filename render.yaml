# Render Blueprint specification for TaskFlow (Full-Stack MERN / NestJS + PostgreSQL + Vite)
# Documentation: https://render.com/docs/blueprint-spec

version: "1"

databases:
  # Managed PostgreSQL Database
  - name: taskflow-db
    databaseName: taskmanager
    user: taskflow
    plan: free
    region: oregon # adjust as needed (e.g. oregon, frankfurt, ohio, singapore)

services:
  # Backend NestJS Web Service
  - type: web
    name: taskflow-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/tasks
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # Frontend React 19 + TypeScript + Vite Static Site
  - type: web
    name: taskflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA client-side routing rewrite rule
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your deployed backend URL (e.g., https://taskflow-backend.onrender.com)
      # Render will prompt for this value when creating the Blueprint instance
      - key: VITE_API_URL
        sync: false
